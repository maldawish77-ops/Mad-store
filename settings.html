<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إعدادات MAD</title><link rel="stylesheet" href="admin.css"></head><body><header><h1>إعدادات متجر MAD | ماد</h1><a href="/admin.html">العودة للوحة الإدارة</a></header><main class="wrap"><section class="card"><h2>الدخول الإداري</h2><label>رمز الإدارة<input id="token" type="password"></label><button id="saveToken">حفظ الرمز محليًا</button></section><section class="card"><h2>إعدادات المتجر</h2><form id="settingsForm" class="grid"><label>الاسم بالعربية<input name="store_name_ar" required></label><label>الاسم بالإنجليزية<input name="store_name_en" required></label><label>العملة<input name="currency" required></label><label>البريد الإلكتروني<input name="support_email" type="email"></label><label>رقم الدعم<input name="support_phone"></label><label>رسوم الشحن<input name="shipping_fee" type="number" min="0"></label><label>حد الشحن المجاني<input name="free_shipping_threshold" type="number" min="0"></label><label>مزود الدفع<input value="Moyasar — دفع إلكتروني فقط" disabled></label><label>وضع الصيانة<select name="maintenance_mode"><option value="false">متوقف</option><option value="true">مفعّل</option></select></label><button type="submit">حفظ الإعدادات</button></form></section><section class="card"><h2>قاعدة البيانات</h2><p>النسخ والاستعادة تتم عبر Neon Production Database.</p></section><section class="card"><h2>سجل العمليات</h2><button id="auditBtn">تحديث السجل</button><pre id="audit"></pre></section><p id="message"></p></main><script src="settings.js"></script></body></html>
