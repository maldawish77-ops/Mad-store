<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حسابي | MAD</title><link rel="stylesheet" href="styles.css"><style>.account-page{min-height:100vh;background:#f5f5f5;padding:40px 0}.account-shell{max-width:900px;margin:auto}.account-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.account-card{background:#fff;border-radius:20px;padding:25px;box-shadow:0 10px 35px #0000000d;margin-bottom:20px}.auth-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.auth-grid form{display:grid;gap:12px}.auth-grid input{padding:12px;border:1px solid #ddd;border-radius:10px}.order-card{border:1px solid #eee;border-radius:14px;padding:16px;margin:12px 0}.order-head{display:flex;justify-content:space-between;gap:10px}.hidden{display:none}@media(max-width:700px){.auth-grid{grid-template-columns:1fr}}</style></head><body><main class="account-page"><div class="container account-shell"><div class="account-top"><a class="brand" href="/"><span class="brand-en">MAD</span><span class="brand-ar">ماد</span></a><a class="btn btn-outline" style="color:#111;border-color:#bbb" href="/">العودة للمتجر</a></div><section id="guest" class="account-card"><h1>حساب العميل</h1><p>سجّل الدخول لمشاهدة طلباتك، أو أنشئ حسابًا جديدًا.</p><div class="auth-grid"><form id="loginForm"><h2>تسجيل الدخول</h2><input required type="email" name="email" placeholder="البريد الإلكتروني"><input required type="password" name="password" placeholder="كلمة المرور"><button class="btn btn-gold">دخول</button></form><form id="registerForm"><h2>إنشاء حساب</h2><input required name="name" placeholder="الاسم الكامل"><input required type="email" name="email" placeholder="البريد الإلكتروني"><input name="phone" placeholder="رقم الجوال"><input required minlength="6" type="password" name="password" placeholder="كلمة المرور (6 أحرف على الأقل)"><button class="btn btn-gold">إنشاء الحساب</button></form></div></section><section id="member" class="hidden"><div class="account-card"><div class="order-head"><div><h1 id="welcome"></h1><p id="profile"></p></div><button class="btn" id="logout">تسجيل الخروج</button></div></div><div class="account-card"><h2>طلباتي</h2><div id="orders"></div></div></section><div class="toast" id="toast"></div></div></main><script src="account.js"></script></body></html>
